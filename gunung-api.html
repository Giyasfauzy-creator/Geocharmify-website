const PILAR = [
  { id: 'apa',      ikon: '🌍', tab: 'Apa Itu',  judul: 'Apa Itu? (Proses)',       tipe: 'teks'   },
  { id: 'penyebab', ikon: '⚡', tab: 'Penyebab', judul: 'Penyebab',                tipe: 'teks'   },
  { id: 'bentang',  ikon: '⛰️', tab: 'Bentang',  judul: 'Bentang Lahan Terbentuk', tipe: 'daftar', penanda: '▪️' },
  { id: 'mitigasi', ikon: '🛡️', tab: 'Mitigasi', judul: 'Cara Mitigasi',           tipe: 'daftar', penanda: '✔️', kotak: true }
];

const $ = (id) => document.getElementById(id);
let idx = 0, semua = false;

function panelHTML(pl) {
  const d = B[pl.id];
  const isi = pl.tipe === 'teks'
    ? d.map(t => `<p class="text-[14.5px] leading-relaxed text-batu-700">${t}</p>`).join('')
    : `<ul class="space-y-2.5">${d.map(t => `<li class="flex gap-2.5 text-[14.5px] leading-relaxed text-batu-700"><span aria-hidden="true">${pl.penanda}</span><span>${t}</span></li>`).join('')}</ul>`;
  const kotak = pl.kotak ? 'rounded-2xl bg-krem-100 ring-1 ring-krem-200 p-4' : '';
  const warna = pl.id === 'mitigasi' ? 'text-terakota-600' : 'text-lumut-700';
  return `<div class="fade-in ${kotak}">
    <h3 class="font-judul font-bold text-lg ${warna} flex items-center gap-2 mb-2"><span aria-hidden="true">${pl.ikon}</span>${pl.judul}</h3>
    ${isi}
  </div>`;
}

function render() {
  const tabs = $('tabs');
  tabs.hidden = semua;
  tabs.innerHTML = PILAR.map((pl, i) => `
    <button role="tab" id="tab-${pl.id}" aria-selected="${i === idx}" tabindex="${i === idx ? 0 : -1}" data-i="${i}"
      class="tab-btn rounded-xl py-2 px-1 text-[12px] font-extrabold text-batu-600 transition flex flex-col items-center gap-0.5 leading-tight">
      <span class="text-lg" aria-hidden="true">${pl.ikon}</span><span>${pl.tab}</span>
    </button>`).join('');
  $('panel').innerHTML = semua
    ? `<div class="space-y-5">${PILAR.map(panelHTML).join('')}</div>`
    : panelHTML(PILAR[idx]);
  $('toggleAll').setAttribute('aria-pressed', String(semua));
  $('toggleLabel').textContent = semua ? 'Mode Fokus (Satu per Satu)' : 'Tampilkan Semua Pilar';
}

$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.tab-btn'); if (!b) return;
  idx = Number(b.dataset.i); render();
});
$('tabs').addEventListener('keydown', (e) => {
  if (!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
  e.preventDefault();
  const n = PILAR.length;
  idx = e.key === 'Home' ? 0 : e.key === 'End' ? n - 1 : e.key === 'ArrowLeft' ? (idx - 1 + n) % n : (idx + 1) % n;
  render(); $('tabs').children[idx].focus();
});
$('toggleAll').addEventListener('click', () => { semua = !semua; render(); });

/* Gambar + latar suasana */
const img = $('fotoBatu');
$('fotoBg').innerHTML = SCENE;
let gambarAda = true;
img.onerror = () => { gambarAda = false; img.remove(); $('ph').hidden = false; $('hintZoom').hidden = true; };
img.src = B.gambar;

/* Lightbox */
const lb = $('lightbox'), lbImg = $('lightboxImg'), lbBox = $('lbBox');
let zoom = false;
function buka() { if (!gambarAda) return; lbImg.src = img.currentSrc || img.src; zoom = false; lbBox.style.transform = 'scale(1)'; lb.classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
function tutup() { lb.classList.add('hidden'); document.body.style.overflow = ''; }
$('btnFoto').addEventListener('click', buka);
$('tutupLightbox').addEventListener('click', tutup);
lb.addEventListener('click', (e) => { if (e.target === lb) tutup(); });
lbBox.addEventListener('click', () => { zoom = !zoom; lbBox.style.transform = zoom ? 'scale(1.9)' : 'scale(1)'; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') tutup(); });

render();
</script>
</body>
</html>
