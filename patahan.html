<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<link rel="preconnect" href="https://fonts.googleapis.com" />

<script>

    colors: {
      batu:  { 50:'#f4f3f0', 100:'#e7e5df', 200:'#d3d0c6', 300:'#b3afa1', 400:'#8d897a', 500:'#6e6a5d', 600:'#57544a', 700:'#45433b', 800:'#34332d', 900:'#24231f' },

<style>
  html { -webkit-tap-highlight-color: transparent; }
  body { font-family:'Nunito',system-ui,sans-serif;
    background: radial-gradient(1200px 500px at 50% -10%, #f8f1e1 0%, transparent 60%),
                repeating-linear-gradient(135deg, rgba(0,0,0,.015) 0 2px, transparent 2px 6px), #ece8dc; }
  .font-judul { font-family:'Fraunces',Georgia,serif; }
  .strata { background-image: linear-gradient(180deg,#d9c9a3 0 14%,#c9b384 14% 28%,#b9a074 28% 40%,#a98d63 40% 58%,#8f7653 58% 74%,#6e5b43 74% 100%); }
  .fade-in { animation: fadeIn .35s ease both; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none;} }
  .tab-btn[aria-selected="true"] { background:#435231; color:#fdfaf3; box-shadow:0 2px 0 #2b361f; }
  #toggleAll[aria-pressed="true"] { background:#435231; color:#fdfaf3; }
  #lbBox { transition: transform .25s ease; }
  [hidden] { display:none !important; }
  button:focus-visible { outline:3px solid #d4a94a; outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<body class="min-h-screen text-batu-800 antialiased">
<div class="mx-auto max-w-md min-h-screen pb-10">

  <header class="relative overflow-hidden rounded-b-[2rem] bg-batu-800 text-krem-50 px-5 pt-6 pb-16 shadow-lg">
    <div class="absolute inset-x-0 bottom-0 h-3 strata opacity-90"></div>
    <div class="absolute -right-10 -top-10 w-40 h-40 rounded-full bg-lumut-600/30 blur-2xl"></div>
    <div class="relative flex items-start justify-between gap-3">
      <div>
        <p class="text-[11px] tracking-[.25em] uppercase text-emas-300 font-bold">Media Pembelajaran Geografi</p>
        <h1 class="font-judul text-2xl font-bold leading-tight mt-1">Proses <span class="text-emas-300">Geologi</span></h1>
      </div>
      <span class="inline-block shrink-0 rounded-full bg-emas-400 text-batu-900 text-xs font-extrabold px-3 py-1">Materi #01</span>
    </div>
    <div class="relative mt-4 flex flex-wrap gap-2">
      <span class="inline-flex items-center gap-1.5 rounded-full bg-krem-50/10 ring-1 ring-krem-50/30 text-xs font-bold px-3 py-1">🪨 Tektonisme</span>
      <span class="inline-flex items-center gap-1.5 rounded-full bg-krem-50/10 ring-1 ring-krem-50/30 text-xs font-bold px-3 py-1">🛡️ Dengan Mitigasi</span>
    </div>
  </header>

  <main class="-mt-10 px-4 space-y-4 relative">

    <section class="rounded-3xl bg-krem-50 shadow-xl ring-1 ring-batu-200 overflow-hidden fade-in">
      <button id="btnFoto" class="relative block w-full aspect-square bg-batu-100" aria-label="Perbesar gambar">
        <div id="fotoBg" class="absolute inset-0"></div>
        <img id="fotoBatu" alt="Ilustrasi Patahan" class="relative w-full h-full object-cover" />
        <div id="ph" hidden class="absolute inset-0 grid place-items-center p-6">
          <div class="rounded-2xl bg-krem-50/95 ring-1 ring-batu-200 shadow-lg px-5 py-4 text-center max-w-[16rem]">
            <div class="text-3xl" aria-hidden="true">🪨</div>
            <p class="mt-1 font-judul font-bold text-batu-900 break-all">patahan.jpg</p>
            <p class="text-xs text-batu-500 mt-1 leading-snug">Letakkan gambar ini di folder yang sama dengan file HTML ini.</p>
          </div>
        </div>
        <span id="hintZoom" class="absolute bottom-3 right-3 rounded-full bg-batu-900/75 text-krem-50 text-[11px] font-bold px-3 py-1.5 backdrop-blur">🔍 Ketuk untuk perbesar</span>
      </button>
      <div class="p-5">
        <h2 class="font-judul text-3xl font-bold text-batu-900 leading-tight">Patahan</h2>
        <p class="mt-1 text-sm italic text-terakota-500 font-semibold">Sesar / Tektonisme</p>
      </div>
    </section>

    <section class="rounded-3xl bg-krem-50 shadow-lg ring-1 ring-batu-200 p-3">
      <div id="tabs" role="tablist" aria-label="Pilar materi" class="grid grid-cols-4 gap-1.5 bg-batu-100 rounded-2xl p-1.5"></div>
      <div class="flex justify-end px-1 pt-3">
        <button id="toggleAll" type="button" aria-pressed="false" class="rounded-full bg-batu-100 text-batu-700 text-xs font-extrabold px-3.5 py-2 ring-1 ring-batu-200 active:scale-95 transition">
          <span id="toggleLabel">Tampilkan Semua Pilar</span>
        </button>
      </div>
      <div id="panel" class="p-2 pt-3 min-h-[200px]"></div>
    </section>

    <footer class="text-center text-xs text-batu-500 pt-2 pb-4">
      <p class="font-bold">Geocharmify © 2026</p>
    </footer>
  </main>
</div>

<div id="lightbox" class="hidden fixed inset-0 z-50 bg-batu-900/95 backdrop-blur-sm flex items-center justify-center p-4 overflow-auto" role="dialog" aria-modal="true" aria-label="Pratinjau gambar">
  <button id="tutupLightbox" class="fixed top-4 right-4 z-10 w-11 h-11 rounded-full bg-krem-50 text-batu-900 text-xl font-extrabold shadow-lg" aria-label="Tutup">✕</button>
  <div id="lbBox" class="relative overflow-hidden rounded-2xl cursor-zoom-in select-none" style="width:min(92vw,80vh);aspect-ratio:1/1">
    <img id="lightboxImg" alt="" class="w-full h-full object-cover" />
  </div>
</div>

const SCENE = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<defs>
<linearGradient id="pSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdeee8"/><stop offset="1" stop-color="#f3c3bd"/></linearGradient>
<clipPath id="pL"><path d="M0 200 H188 L228 400 H0Z"/></clipPath>
<clipPath id="pR"><path d="M196 240 H400 V400 H236Z"/></clipPath>
</defs>
<rect width="400" height="400" fill="url(#pSky)"/>
<circle cx="320" cy="84" r="30" fill="#fff4d6" opacity=".9"/>
<g clip-path="url(#pL)"><rect y="200" width="400" height="46" fill="#7fae62"/><rect y="246" width="400" height="44" fill="#c98b6b"/><rect y="290" width="400" height="44" fill="#a8694f"/><rect y="334" width="400" height="40" fill="#8a5240"/><rect y="374" width="400" height="40" fill="#6e4132"/></g>
<g clip-path="url(#pR)"><rect y="240" width="400" height="46" fill="#7fae62"/><rect y="286" width="400" height="44" fill="#c98b6b"/><rect y="330" width="400" height="44" fill="#a8694f"/><rect y="374" width="400" height="40" fill="#8a5240"/></g>
<path d="M188 200 L228 400" stroke="#4a3525" stroke-width="4" fill="none" stroke-dasharray="2 0"/>
<path d="M196 240 L236 400" stroke="#4a3525" stroke-width="4" fill="none"/>
<g fill="none" stroke="#4a3525" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M96 180 V130 M80 148 L96 130 L112 148"/><path d="M312 224 V274 M296 256 L312 274 L328 256"/></g>
</svg>`;

const PILAR = [
  { id: 'apa',      ikon: '🌍', tab: 'Apa Itu',  judul: 'Apa Itu? (Proses)',       tipe: 'teks'   },
  { id: 'penyebab', ikon: '⚡', tab: 'Penyebab', judul: 'Penyebab',                tipe: 'teks'   },
  { id: 'bentang',  ikon: '⛰️', tab: 'Bentang',  judul: 'Bentang Lahan Terbentuk', tipe: 'daftar', penanda: '▪️' },
  { id: 'mitigasi', ikon: '🛡️', tab: 'Mitigasi', judul: 'Cara Mitigasi',           tipe: 'daftar', penanda: '✔️', kotak: true }
];

const $ = (id) => document.getElementById(id);
let idx = 0, semua = false;

function panelHTML(pl) {
  const d = B[pl.id];
  const isi = pl.tipe === 'teks'
    ? d.map(t => `<p class="text-[14.5px] leading-relaxed text-batu-700">${t}</p>`).join('')
    : `<ul class="space-y-2.5">${d.map(t => `<li class="flex gap-2.5 text-[14.5px] leading-relaxed text-batu-700"><span aria-hidden="true">${pl.penanda}</span><span>${t}</span></li>`).join('')}</ul>`;
  const kotak = pl.kotak ? 'rounded-2xl bg-krem-100 ring-1 ring-krem-200 p-4' : '';
  const warna = pl.id === 'mitigasi' ? 'text-terakota-600' : 'text-lumut-700';
  return `<div class="fade-in ${kotak}">
    <h3 class="font-judul font-bold text-lg ${warna} flex items-center gap-2 mb-2"><span aria-hidden="true">${pl.ikon}</span>${pl.judul}</h3>
    ${isi}
  </div>`;
}

function render() {
  const tabs = $('tabs');
  tabs.hidden = semua;
  tabs.innerHTML = PILAR.map((pl, i) => `
    <button role="tab" id="tab-${pl.id}" aria-selected="${i === idx}" tabindex="${i === idx ? 0 : -1}" data-i="${i}"
      class="tab-btn rounded-xl py-2 px-1 text-[12px] font-extrabold text-batu-600 transition flex flex-col items-center gap-0.5 leading-tight">
      <span class="text-lg" aria-hidden="true">${pl.ikon}</span><span>${pl.tab}</span>
    </button>`).join('');
  $('panel').innerHTML = semua
    ? `<div class="space-y-5">${PILAR.map(panelHTML).join('')}</div>`
    : panelHTML(PILAR[idx]);
  $('toggleAll').setAttribute('aria-pressed', String(semua));
  $('toggleLabel').textContent = semua ? 'Mode Fokus (Satu per Satu)' : 'Tampilkan Semua Pilar';
}

$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.tab-btn'); if (!b) return;
  idx = Number(b.dataset.i); render();
});
$('tabs').addEventListener('keydown', (e) => {
  if (!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
  e.preventDefault();
  const n = PILAR.length;
  idx = e.key === 'Home' ? 0 : e.key === 'End' ? n - 1 : e.key === 'ArrowLeft' ? (idx - 1 + n) % n : (idx + 1) % n;
  render(); $('tabs').children[idx].focus();
});
$('toggleAll').addEventListener('click', () => { semua = !semua; render(); });

/* Gambar + latar suasana */
const img = $('fotoBatu');
$('fotoBg').innerHTML = SCENE;
let gambarAda = true;
img.onerror = () => { gambarAda = false; img.remove(); $('ph').hidden = false; $('hintZoom').hidden = true; };
img.src = B.gambar;

/* Lightbox */
const lb = $('lightbox'), lbImg = $('lightboxImg'), lbBox = $('lbBox');
let zoom = false;
function buka() { if (!gambarAda) return; lbImg.src = img.currentSrc || img.src; zoom = false; lbBox.style.transform = 'scale(1)'; lb.classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
function tutup() { lb.classList.add('hidden'); document.body.style.overflow = ''; }
$('btnFoto').addEventListener('click', buka);
$('tutupLightbox').addEventListener('click', tutup);
lb.addEventListener('click', (e) => { if (e.target === lb) tutup(); });
lbBox.addEventListener('click', () => { zoom = !zoom; lbBox.style.transform = zoom ? 'scale(1.9)' : 'scale(1)'; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') tutup(); });

render();
</script>
</body>
