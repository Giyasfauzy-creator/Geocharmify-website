<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="theme-color" content="#34332d" />
<title>Batu Marmer – Geocharmify</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<script>
  tailwind.config = { theme: { extend: {
    colors: {
      batu:  { 50:'#f4f3f0', 100:'#e7e5df', 200:'#d3d0c6', 300:'#b3afa1', 400:'#8d897a', 500:'#6e6a5d', 600:'#57544a', 700:'#45433b', 800:'#34332d', 900:'#24231f' },

<style>
  html { -webkit-tap-highlight-color: transparent; }
  body { font-family:'Nunito',system-ui,sans-serif;
    background: radial-gradient(1200px 500px at 50% -10%, #f8f1e1 0%, transparent 60%),
                repeating-linear-gradient(135deg, rgba(0,0,0,.015) 0 2px, transparent 2px 6px), #ece8dc; }
  .font-judul { font-family:'Fraunces',Georgia,serif; }
  .strata { background-image: linear-gradient(180deg,#d9c9a3 0 14%,#c9b384 14% 28%,#b9a074 28% 40%,#a98d63 40% 58%,#8f7653 58% 74%,#6e5b43 74% 100%); }

  @keyframes fadeIn { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none;} }

<div class="min-h-screen text-batu-800 antialiased">
<div class="mx-auto max-w-md min-h-screen pb-10">

  <header class="relative overflow-hidden rounded-b-[2rem] bg-batu-800 text-krem-50 px-5 pt-6 pb-16 shadow-lg">
    <div class="absolute inset-x-0 bottom-0 h-3 strata opacity-90"></div>
    <div class="absolute -right-10 -top-10 w-40 h-40 rounded-full bg-lumut-600/30 blur-2xl"></div>
    <div class="relative flex items-start justify-between gap-3">
      <div>
        <p class="text-[11px] tracking-[.25em] uppercase text-emas-300 font-bold">Koleksi Edukasi Geologi</p>
        <h1 class="font-judul text-2xl font-bold leading-tight mt-1">Geo<span class="text-emas-300">charmify</span></h1>
      </div>
      <span class="inline-block shrink-0 rounded-full bg-emas-400 text-batu-900 text-xs font-extrabold px-3 py-1">Seri #03</span>
    </div>
    <div class="relative mt-4 flex flex-wrap gap-2">
      <span class="inline-flex items-center gap-1.5 rounded-full bg-krem-50/10 ring-1 ring-krem-50/30 text-xs font-bold px-3 py-1">🔥 Metamorf</span>
    </div>
  </header>

  <main class="-mt-10 px-4 space-y-4 relative">

    <section class="rounded-3xl bg-krem-50 shadow-xl ring-1 ring-batu-200 overflow-hidden fade-in">
      <button id="btnFoto" class="relative block w-full aspect-square bg-batu-100 group" aria-label="Perbesar foto batuan">
        <div id="fotoBg" class="absolute inset-0"></div>
        <img id="fotoBatu" alt="Foto Batu Marmer" class="relative w-full h-full object-contain p-6 drop-shadow-xl transition-transform duration-300 group-active:scale-95" />
        <span class="absolute bottom-3 right-3 rounded-full bg-batu-900/75 text-krem-50 text-[11px] font-bold px-3 py-1.5 backdrop-blur">🔍 Ketuk untuk perbesar</span>
      </button>
      <div class="p-5">
        <h2 class="font-judul text-3xl font-bold text-batu-900 leading-tight">Batu Marmer</h2>
        <p class="mt-1 text-sm italic text-terakota-500 font-semibold">Marble, batuan metamorf non-foliasi (kalsit/dolomit terubah)</p>
      </div>
    </section>

    <section class="rounded-3xl bg-krem-50 shadow-lg ring-1 ring-batu-200 p-3">
      <div role="tablist" aria-label="Informasi batuan" class="grid grid-cols-3 gap-1.5 bg-batu-100 rounded-2xl p-1.5">
        <button role="tab" id="tab-penjelasan" aria-selected="true"  aria-controls="panel" data-tab="penjelasan" class="tab-btn rounded-xl py-2.5 text-[13px] font-extrabold text-batu-600 transition">📖 Penjelasan</button>
        <button role="tab" id="tab-proses"     aria-selected="false" aria-controls="panel" data-tab="proses"     class="tab-btn rounded-xl py-2.5 text-[13px] font-extrabold text-batu-600 transition">⚙️ Proses</button>
        <button role="tab" id="tab-lokasi"     aria-selected="false" aria-controls="panel" data-tab="lokasi"     class="tab-btn rounded-xl py-2.5 text-[13px] font-extrabold text-batu-600 transition">📍 Lokasi</button>
      </div>
      <div id="panel" role="tabpanel" class="p-2 pt-4 min-h-[220px]"></div>
    </section>

    <footer class="text-center text-xs text-batu-500 pt-2 pb-4">
      <p class="font-bold">Geocharmify © <span id="tahun"></span></p>
    </footer>
  </main>
</div>

<div id="lightbox" class="hidden fixed inset-0 z-50 bg-batu-900/95 backdrop-blur-sm flex items-center justify-center p-4 overflow-auto" role="dialog" aria-modal="true" aria-label="Pratinjau foto">

</div>

    "warna": "Putih, abu-abu, merah muda, hijau, hingga hitam, biasanya dengan corak urat.",
    "tekstur": "Granular kristalin (butiran kristal saling mengunci), padat, dan bisa dipoles mengilap."
  },
  "proses": [
    [
      "🪨",
      "Batu Gamping Awal",
      "Bermula dari batu gamping atau dolomit sebagai batuan asal."
    ],
    [
      "⬇️",
      "Terkubur Dalam",
      "Batuan terbawa ke kedalaman akibat pergerakan lempeng atau tertimbun endapan."
    ],
    [
      "🔥",
      "Panas & Tekanan",
      "Suhu dan tekanan tinggi (misalnya dekat intrusi magma) mengubah batuan tanpa melelehkannya."
    ],
    [
      "💎",
      "Kristal Tumbuh Ulang",
      "Mineral mengkristal ulang (rekristalisasi) dan menjadi marmer yang padat dan berurat."
    ]
  ],
  "lokasi": [
    "Di Indonesia, marmer terkenal dari Tulungagung (Jawa Timur) dan juga ditambang di Sulawesi Selatan, misalnya kawasan Pangkep.",
    "Terbentuk di zona yang pernah mengalami pemanasan atau tekanan besar, misalnya dekat kontak intrusi magma."
  ],
  "kegunaan": [
    "Lantai, dinding, meja, tangga, dan hiasan interior.",
    "Bahan patung dan kerajinan, serta nisan atau monumen.",
    "Serbuk marmer dipakai sebagai campuran industri, cat, dan kosmetik tertentu."
  ],
  "funFact": "Marmer dan batu gamping punya komposisi kimia yang mirip. Bedanya, marmer sudah \"dimasak\" di dalam bumi!"
};

const SCENE = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<defs>
<linearGradient id="mTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1edff"/><stop offset="1" stop-color="#ddd5f6"/></linearGradient>
<radialGradient id="mHeat" cx=".5" cy="1" r=".75"><stop offset="0" stop-color="#ffa05a" stop-opacity=".95"/><stop offset=".6" stop-color="#ff7a4a" stop-opacity=".35"/><stop offset="1" stop-color="#ff7a4a" stop-opacity="0"/></radialGradient>
<filter id="mBlur"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="400" height="400" fill="url(#mTop)"/>
<!-- folded strata -->
<path d="M0 150 C70 130 130 170 200 150 S340 128 400 150 V190 C330 170 270 208 200 190 S70 170 0 190Z" fill="#cfc6e8"/>
<path d="M0 190 C70 170 130 208 200 190 S330 170 400 190 V228 C340 210 270 246 200 228 S70 210 0 228Z" fill="#e3c9d8"/>
<path d="M0 228 C70 210 130 246 200 228 S340 210 400 228 V272 C330 258 270 286 200 272 S70 256 0 272Z" fill="#bdb4d8"/>
<!-- marble slab ground -->
<path d="M0 272 C70 262 130 280 200 272 S340 262 400 272 V400 H0Z" fill="#f6e6ec"/>
<g fill="none" stroke="#a9a3b8" stroke-width="2.2" stroke-linecap="round" opacity=".8"><path d="M10 300 q40 -12 80 4 t90 -6"/><path d="M230 296 q50 -14 90 2 t80 -4"/><path d="M40 340 q50 -10 100 6"/><path d="M250 350 q40 -12 90 4"/></g>
<g fill="none" stroke="#f2a4b4" stroke-width="3" stroke-linecap="round" opacity=".8"><path d="M20 322 q60 -14 120 6 t110 -8"/><path d="M200 372 q50 -12 100 6 t100 -6"/></g>
<!-- magma heat from below -->
<rect y="300" width="400" height="100" fill="url(#mHeat)"/>
<g filter="url(#mBlur)" opacity=".9"><ellipse cx="40" cy="410" rx="90" ry="40" fill="#ff7a3a"/><ellipse cx="370" cy="410" rx="90" ry="40" fill="#ff7a3a"/></g>
<!-- pressure arrows -->
<g fill="none" stroke="#7f73ad" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 210 H44 M32 198 L46 210 L32 222"/><path d="M388 210 H356 M368 198 L354 210 L368 222"/></g>
<!-- heat waves -->
<g fill="none" stroke="#ff8a4a" stroke-width="3" stroke-linecap="round" opacity=".7"><path d="M30 392 q6 -10 0 -20 t0 -20"/><path d="M60 396 q6 -10 0 -20 t0 -20"/><path d="M340 392 q6 -10 0 -20 t0 -20"/><path d="M370 396 q6 -10 0 -20 t0 -20"/></g>
</svg>`;

const $ = (id) => document.getElementById(id);
const f = (n) => String(n).replace('.', ',');
let tabAktif = 'penjelasan';

function ilustrasi(b) {
  const [c1, c2] = b.warna;
  const mata = b.wajah === 'imut'
    ? '<circle cx="150" cy="190" r="17" fill="#111"/><circle cx="246" cy="190" r="17" fill="#111"/><circle cx="145" cy="184" r="6" fill="#fff"/><circle cx="241" cy="184" r="6" fill="#fff"/>'
    : b.wajah === 'kedip'
    ? '<path d="M132 192 q18 -16 36 0" stroke="#111" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="246" cy="190" r="15" fill="#111"/><circle cx="241" cy="184" r="5" fill="#fff"/>'
    : '<circle cx="150" cy="190" r="15" fill="#111"/><circle cx="246" cy="190" r="15" fill="#111"/><circle cx="145" cy="184" r="5" fill="#fff"/><circle cx="241" cy="184" r="5" fill="#fff"/>';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c2}"/><stop offset="1" stop-color="${c1}"/></linearGradient></defs><ellipse cx="200" cy="300" rx="140" ry="18" fill="rgba(0,0,0,.12)"/><path d="M60 230 L90 120 L170 60 L270 70 L340 140 L350 235 L290 290 L130 292 Z" fill="url(#g)" stroke="rgba(0,0,0,.18)" stroke-width="4" stroke-linejoin="round"/><path d="M90 120 L170 60 L200 140 Z M270 70 L340 140 L200 140 Z" fill="rgba(255,255,255,.18)"/><path d="M60 230 L130 292 L200 140 Z" fill="rgba(0,0,0,.10)"/>${mata}<ellipse cx="118" cy="222" rx="18" ry="11" fill="#ff8fa8" opacity=".6"/><ellipse cx="278" cy="222" rx="18" ry="11" fill="#ff8fa8" opacity=".6"/><path d="M182 228 q18 18 36 0" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function baris(ikon, label, isi) {
  return `<div class="flex gap-3 items-start py-3 border-b border-batu-100 last:border-0">
    <div class="w-9 h-9 shrink-0 rounded-xl bg-lumut-100 grid place-items-center text-lg" aria-hidden="true">${ikon}</div>
    <div><p class="text-[11px] uppercase tracking-wider font-extrabold text-batu-400">${label}</p>
    <p class="text-[14.5px] leading-relaxed text-batu-800">${isi}</p></div></div>`;
}

function panelPenjelasan() {
  const p = B.profil;
  const mohs = p.mohsMin === p.mohsMax ? f(p.mohsMin) : `${f(p.mohsMin)} – ${f(p.mohsMax)}`;
  const kiri = ((p.mohsMin - 1) / 9) * 100;
  const lebar = Math.max(((p.mohsMax - p.mohsMin) / 9) * 100, 4);
  const ticks = Array.from({ length: 10 }, (_, i) => `<span class="flex-1 text-center text-[10px] font-bold text-batu-400">${i + 1}</span>`).join('');
  return `<div class="fade-in">
    <p class="text-[15px] leading-relaxed text-batu-700 pb-3">${B.ringkasan}</p>
    ${baris('🧬','Jenis Batuan', p.jenisKet)}
    ${baris('⚗️','Komposisi Mineral Utama', p.mineral)}
    <div class="flex gap-3 items-start py-3 border-b border-batu-100">
      <div class="w-9 h-9 shrink-0 rounded-xl bg-lumut-100 grid place-items-center text-lg" aria-hidden="true">💪</div>
      <div class="flex-1">
        <p class="text-[11px] uppercase tracking-wider font-extrabold text-batu-400">Kekerasan (Skala Mohs)</p>
        <p class="text-[14.5px] font-extrabold text-batu-800">${mohs} <span class="font-semibold text-batu-500">dari 10</span></p>
        <div class="mt-2 relative h-3 rounded-full bg-batu-100 overflow-hidden"><div class="absolute inset-y-0 rounded-full" style="left:${kiri}%;width:${lebar}%;background:linear-gradient(90deg,#d4a94a,#b05f3c)"></div></div>
        <div class="flex mt-1">${ticks}</div>
        <p class="text-[11px] text-batu-500 mt-1">Pembanding: kuku ≈ 2,5 · koin tembaga ≈ 3 · kaca ≈ 5,5</p>
      </div>
    </div>
    ${baris('🎨','Warna', p.warna)}
    ${baris('🔬','Tekstur', p.tekstur)}
    <div class="mt-3 rounded-2xl bg-emas-300/25 ring-1 ring-emas-300 p-3.5 text-sm leading-relaxed"><span class="font-extrabold text-emas-500">💡 Tahukah kamu?</span> ${B.funFact}</div>
  </div>`;
}

function panelProses() {
  const n = B.proses.length;
  return `<ol class="fade-in">` + B.proses.map((s, i) => `
    <li class="relative pl-14 pb-6 last:pb-0">
      ${i < n - 1 ? '<span class="absolute left-[21px] top-11 bottom-0 w-0.5 bg-gradient-to-b from-terakota-400 to-lumut-300"></span>' : ''}
      <span class="absolute left-0 top-0 w-11 h-11 rounded-2xl bg-batu-800 text-xl grid place-items-center shadow-md" aria-hidden="true">${s[0]}</span>
      <p class="text-[11px] font-extrabold text-terakota-500 uppercase tracking-wider">Tahap ${i + 1}</p>
      <h4 class="font-extrabold text-batu-900 leading-tight">${s[1]}</h4>
      <p class="text-[14px] leading-relaxed text-batu-600 mt-0.5">${s[2]}</p>
    </li>`).join('') + `</ol>`;
}

function panelLokasi() {
  const li = (arr, ikon) => arr.map(t => `<li class="flex gap-2.5 text-[14.5px] leading-relaxed text-batu-700"><span aria-hidden="true">${ikon}</span><span>${t}</span></li>`).join('');
  return `<div class="fade-in space-y-5">
    <div><h4 class="font-judul font-bold text-lg text-lumut-700">📍 Persebaran di Indonesia</h4><ul class="mt-2 space-y-2.5">${li(B.lokasi,'▪️')}</ul></div>
    <div class="rounded-2xl bg-krem-100 ring-1 ring-krem-200 p-4"><h4 class="font-judul font-bold text-lg text-terakota-600">🛠️ Kegunaan & Manfaat</h4><ul class="mt-2 space-y-2.5">${li(B.kegunaan,'✔️')}</ul></div>
  </div>`;
}

function renderPanel() {
  const peta = { penjelasan: panelPenjelasan, proses: panelProses, lokasi: panelLokasi };
  $('panel').innerHTML = peta[tabAktif]();
  $('panel').setAttribute('aria-labelledby', 'tab-' + tabAktif);
  document.querySelectorAll('.tab-btn').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tabAktif)));
}
document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => { tabAktif = b.dataset.tab; renderPanel(); }));

/* Foto + lightbox */
const img = $('fotoBatu');
img.onerror = () => { img.onerror = null; img.src = ilustrasi(B); };
img.src = B.foto;
$('fotoBg').innerHTML = SCENE;

const lb = $('lightbox'), lbImg = $('lightboxImg'), lbBox = $('lbBox');
let zoom = false;
function buka() { lbImg.src = img.currentSrc || img.src; $('lbScene').innerHTML = SCENE; zoom = false; lbBox.style.transform = 'scale(1)'; lb.classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
function tutup() { lb.classList.add('hidden'); document.body.style.overflow = ''; }
$('btnFoto').addEventListener('click', buka);
$('tutupLightbox').addEventListener('click', tutup);
lb.addEventListener('click', (e) => { if (e.target === lb) tutup(); });
lbBox.addEventListener('click', () => { zoom = !zoom; lbBox.style.transform = zoom ? 'scale(1.9)' : 'scale(1)'; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') tutup(); });

$('tahun').textContent = new Date().getFullYear();
renderPanel();
</script>
</div>

</body></html>
